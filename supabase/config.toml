# Supabase project configuration for the NextGen portal.
#
# The four attendance Edge Functions must always run with a verified JWT
# (spec section 30): they resolve the caller with requireUser(), then act with
# the service-role key server side. The browser only ever holds the
# publishable key from .env.local.

project_id = "nextgen"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.create-attendance-token]
verify_jwt = true

[functions.verify-attendance]
verify_jwt = true

[functions.get-current-attendance-session]
verify_jwt = true

[functions.update-student-location]
verify_jwt = true
